<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" font-family="Segoe UI, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="slab" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#1d2d4a"/>
      <stop offset="1" stop-color="#121e34"/>
    </linearGradient>
    <filter id="glow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="c1"><polygon points="170,103 275,155 170,207 65,155"/></clipPath>
    <clipPath id="c2"><polygon points="440,103 545,155 440,207 335,155"/></clipPath>
    <clipPath id="c3"><polygon points="710,103 815,155 710,207 605,155"/></clipPath>
  </defs>

  <rect width="880" height="300" rx="18" fill="url(#bg)"/>

  <!-- stage labels -->
  <text x="170" y="52" fill="#f8fafc" font-size="17" font-weight="700" text-anchor="middle">Radios in range</text>
  <text x="440" y="52" fill="#f8fafc" font-size="17" font-weight="700" text-anchor="middle">One call from PHP</text>
  <text x="710" y="52" fill="#f8fafc" font-size="17" font-weight="700" text-anchor="middle">A place you recognise</text>

  <!-- ================= panel 1 ================= -->
  <polygon points="65,155 170,207 170,217 65,165" fill="#0a1322"/>
  <polygon points="170,207 275,155 275,165 170,217" fill="#0d182b"/>
  <polygon points="170,103 275,155 170,207 65,155" fill="url(#slab)"/>
  <g clip-path="url(#c1)" fill="none" stroke-width="1.4">
    <g stroke="#38bdf8">
      <ellipse cx="132" cy="140" rx="24" ry="12" opacity="0.55"/>
      <ellipse cx="132" cy="140" rx="46" ry="23" opacity="0.3"/>
      <ellipse cx="132" cy="140" rx="68" ry="34" opacity="0.13"/>
    </g>
    <g stroke="#818cf8">
      <ellipse cx="212" cy="168" rx="22" ry="11" opacity="0.5"/>
      <ellipse cx="212" cy="168" rx="42" ry="21" opacity="0.27"/>
      <ellipse cx="212" cy="168" rx="64" ry="32" opacity="0.12"/>
    </g>
  </g>
  <g>
    <polygon points="132,126 143,131.5 132,137 121,131.5" fill="#3d5075"/>
    <polygon points="121,131.5 132,137 132,145 121,139.5" fill="#19233d"/>
    <polygon points="132,137 143,131.5 143,139.5 132,145" fill="#24334f"/>
    <line x1="127" y1="129" x2="124" y2="121" stroke="#64748b" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="137" y1="129" x2="140" y2="121" stroke="#64748b" stroke-width="1.4" stroke-linecap="round"/>
    <circle cx="132" cy="131.5" r="2.2" fill="#38bdf8" filter="url(#glow)"/>
  </g>
  <g>
    <polygon points="212,154 223,159.5 212,165 201,159.5" fill="#3d5075"/>
    <polygon points="201,159.5 212,165 212,173 201,167.5" fill="#19233d"/>
    <polygon points="212,165 223,159.5 223,167.5 212,173" fill="#24334f"/>
    <line x1="207" y1="157" x2="204" y2="149" stroke="#64748b" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="217" y1="157" x2="220" y2="149" stroke="#64748b" stroke-width="1.4" stroke-linecap="round"/>
    <circle cx="212" cy="159.5" r="2.2" fill="#818cf8" filter="url(#glow)"/>
  </g>
  <text x="170" y="252" fill="#94a3b8" font-size="13" text-anchor="middle">SSID · BSSID · signal · channel</text>
  <text x="170" y="271" fill="#64748b" font-size="11.5" text-anchor="middle">whatever the radio can see</text>

  <!-- arrow 1 -->
  <g stroke="url(#accent)" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M292 155 h20"/>
    <path d="M306 148 l7 7 -7 7"/>
  </g>

  <!-- ================= panel 2 ================= -->
  <polygon points="335,155 440,207 440,217 335,165" fill="#0a1322"/>
  <polygon points="440,207 545,155 545,165 440,217" fill="#0d182b"/>
  <polygon points="440,103 545,155 440,207 335,155" fill="url(#slab)"/>
  <g clip-path="url(#c2)" stroke="#22314e" stroke-width="1" opacity="0.5">
    <line x1="387.5" y1="129" x2="492.5" y2="181"/>
    <line x1="492.5" y1="129" x2="387.5" y2="181"/>
  </g>
  <g transform="translate(462,126) matrix(1,0.5,-1,0.5,0,0)">
    <rect x="0" y="0" width="46" height="88" rx="8" fill="#020617" stroke="#3b4a63" stroke-width="1.4"/>
    <rect x="4" y="5" width="38" height="78" rx="5" fill="#0b1120"/>
    <rect x="8" y="12" width="30" height="14" rx="3.5" fill="#16233c"/>
    <g fill="#38bdf8"><rect x="28" y="17" width="1.8" height="4"/><rect x="31" y="15.5" width="1.8" height="5.5"/><rect x="34" y="14" width="1.8" height="7"/></g>
    <rect x="8" y="30" width="30" height="14" rx="3.5" fill="#16233c"/>
    <g fill="#38bdf8"><rect x="28" y="35" width="1.8" height="4"/><rect x="31" y="33.5" width="1.8" height="5.5"/><rect x="34" y="32" width="1.8" height="7" opacity="0.24"/></g>
    <rect x="8" y="48" width="30" height="14" rx="3.5" fill="#16233c"/>
    <g fill="#38bdf8"><rect x="28" y="53" width="1.8" height="4"/><rect x="31" y="51.5" width="1.8" height="5.5" opacity="0.24"/><rect x="34" y="50" width="1.8" height="7" opacity="0.24"/></g>
    <rect x="8" y="66" width="30" height="10" rx="3" fill="#0f2438" stroke="#1f4f6b" stroke-width="0.7"/>
  </g>
  <rect x="384" y="74" width="112" height="26" rx="7" fill="#020617" stroke="#334155"/>
  <text x="440" y="91" fill="#38bdf8" font-size="12" font-family="Consolas, monospace" text-anchor="middle">Wifi::scan()</text>
  <text x="440" y="252" fill="#94a3b8" font-size="13" text-anchor="middle">cached list now, fresh scan by event</text>
  <text x="440" y="271" fill="#64748b" font-size="11.5" text-anchor="middle">no Kotlin, no polling, no GPS</text>

  <!-- arrow 2 -->
  <g stroke="url(#accent)" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M562 155 h20"/>
    <path d="M576 148 l7 7 -7 7"/>
  </g>

  <!-- ================= panel 3 ================= -->
  <polygon points="605,155 710,207 710,217 605,165" fill="#0a1322"/>
  <polygon points="710,207 815,155 815,165 710,217" fill="#0d182b"/>
  <polygon points="710,103 815,155 710,207 605,155" fill="url(#slab)"/>
  <g clip-path="url(#c3)" fill="none" stroke="#38bdf8" stroke-width="1.4">
    <ellipse cx="710" cy="168" rx="30" ry="15" opacity="0.45"/>
    <ellipse cx="710" cy="168" rx="56" ry="28" opacity="0.22"/>
    <ellipse cx="710" cy="168" rx="82" ry="41" opacity="0.1"/>
  </g>
  <ellipse cx="710" cy="168" rx="13" ry="6.5" fill="#0a1322" opacity="0.85"/>
  <g filter="url(#glow)">
    <path d="M710 126 a13 13 0 0 1 13 13 c0 10 -13 29 -13 29 c0 0 -13 -19 -13 -29 a13 13 0 0 1 13 -13 z" fill="url(#accent)"/>
  </g>
  <circle cx="710" cy="139" r="5" fill="#0b1120"/>
  <rect x="642" y="96" width="136" height="28" rx="8" fill="#0f2438" stroke="#1f4f6b"/>
  <text x="710" y="115" fill="#38bdf8" font-size="12.5" font-family="Consolas, monospace" text-anchor="middle">a3f9c17d…</text>
  <text x="710" y="252" fill="#94a3b8" font-size="13" text-anchor="middle">one stable, order-independent hash</text>
  <text x="710" y="271" fill="#64748b" font-size="11.5" text-anchor="middle">match it later with a similarity score</text>
</svg>
